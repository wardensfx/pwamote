[package]
name = "pwamote-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-server = { version = "0.9.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
directories = "6.0.0"
futures-util = "0.3.34"
hostname = "0.4.2"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls"] }
mdns-sd = "0.21.7"
mime_guess = "2.0.5"
pwamote-core = { path = "../pwamote-core" }
qrcode = "0.14.1"
rand = "0.10.3"
rcgen = { version = "0.14.10", features = ["pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rust-embed = "8.13.0"
semver = "1.0.28"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-compat"] }
x509-parser = "0.18.1"

[target."cfg(windows)".dependencies]
arboard = "3.7.0"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Magnification", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Registry"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
