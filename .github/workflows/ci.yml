name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Appelé par release.yml avec la version du tag : mêmes contrôles, binaires versionnés.
  workflow_call:
    inputs:
      version:
        description: "Version SemVer à injecter (ex. 1.2.3) ; vide hors release"
        type: string
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Vide hors release (null == '' dans les expressions GitHub).
  PWAMOTE_VERSION: ${{ inputs.version }}
  # Seuls les binaires de release vérifient les mises à jour (voir crates/pwamote-server/src/update.rs) :
  # une compilation locale ou une CI ordinaire ne contacte jamais GitHub.
  PWAMOTE_RELEASE_REPO: ${{ inputs.version != '' && github.repository || '' }}
  # Signature Authenticode (Azure Artifact Signing), uniquement pour les releases et seulement
  # quand les variables du dépôt sont renseignées : sans elles, les binaires restent non signés
  # comme avant. Mise en place : docs/signature-windows.md.
  SIGN_ENABLED: ${{ inputs.version != '' && vars.AZURE_SIGNING_ACCOUNT != '' }}

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Injecter la version du tag
        if: inputs.version != ''
        shell: bash
        working-directory: .
        run: node scripts/set-version.mjs "$PWAMOTE_VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-ui
    steps:
      - uses: actions/checkout@v4
      - name: Injecter la version du tag
        if: inputs.version != ''
        shell: bash
        working-directory: .
        run: node scripts/set-version.mjs "$PWAMOTE_VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-dist
          path: desktop-ui/dist

  rust:
    # Le serveur cible Windows : on teste et on compile là où il tournera.
    runs-on: windows-latest
    needs: [client, desktop-ui]
    steps:
      - uses: actions/checkout@v4
      - name: Injecter la version du tag
        if: inputs.version != ''
        shell: bash
        working-directory: .
        run: node scripts/set-version.mjs "$PWAMOTE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist
      - uses: actions/download-artifact@v4
        with:
          name: desktop-ui-dist
          path: desktop-ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p pwamote-server
      - name: Signer le serveur
        if: env.SIGN_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\release\pwamote-server.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Vérifier la signature
        if: env.SIGN_ENABLED == 'true'
        shell: pwsh
        run: ./scripts/verify-signature.ps1 target/release/pwamote-server.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pwamote-server-windows
          path: target/release/pwamote-server.exe

  # Installeur de l'application de bureau (NSIS, installation par utilisateur, sans droits administrateur).
  installer:
    runs-on: windows-latest
    needs: [client, desktop-ui]
    steps:
      - uses: actions/checkout@v4
      - name: Injecter la version du tag
        if: inputs.version != ''
        shell: bash
        working-directory: .
        run: node scripts/set-version.mjs "$PWAMOTE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist
      - uses: actions/download-artifact@v4
        with:
          name: desktop-ui-dist
          path: desktop-ui/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - run: npm ci
        working-directory: desktop-ui
      # Tauri signe lui-même l'exécutable de l'application, l'installeur et le désinstalleur
      # (bundle > windows > signCommand), après ses propres retouches du binaire : une signature
      # posée avant serait invalidée. La configuration n'est ajoutée qu'en release signée.
      - name: Préparer la signature
        if: env.SIGN_ENABLED == 'true'
        shell: bash
        env:
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          for v in ENDPOINT ACCOUNT PROFILE; do
            [[ -n "${!v}" ]] || { echo "::error::Variable AZURE_SIGNING_$v manquante"; exit 1; }
          done
          cargo install artifact-signing-cli --version 0.12.0 --locked
          node -e '
            const cmd = `artifact-signing-cli -e ${process.env.ENDPOINT} -a ${process.env.ACCOUNT} -c ${process.env.PROFILE} -d PwaMote %1`;
            require("fs").writeFileSync("crates/pwamote-desktop/tauri.signing.json", JSON.stringify({ bundle: { windows: { signCommand: cmd } } }));
          '
      # Le CLI Tauri est installé dans desktop-ui ; on le lance depuis le dossier du crate.
      - name: Construire l'installeur
        shell: bash
        working-directory: crates/pwamote-desktop
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          args=(--ci)
          [[ -f tauri.signing.json ]] && args+=(--config tauri.signing.json)
          npm exec --prefix ../../desktop-ui -- tauri build "${args[@]}"
      - name: Vérifier les signatures
        if: env.SIGN_ENABLED == 'true'
        shell: pwsh
        run: ./scripts/verify-signature.ps1 target/release/pwamote-desktop.exe (Get-Item target/release/bundle/nsis/*.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: pwamote-installer-windows
          path: target/release/bundle/nsis/*.exe
      # Le même exécutable, sans installation, tel que `tauri build` l'a compilé (mode production
      # de Tauri) et, en release signée, signé.
      - uses: actions/upload-artifact@v4
        with:
          name: pwamote-portable-windows
          path: target/release/pwamote-desktop.exe
          if-no-files-found: error

  # Scripts du dépôt (injection de version pour les releases).
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs

  # Aperçu des notes de la prochaine release, dans le résumé du run (onglet Actions).
  changelog:
    if: inputs.version == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes git-cliff@2.14.2 --unreleased >> "$GITHUB_STEP_SUMMARY"

  # Les types TypeScript générés par ts-rs doivent toujours refléter le protocole Rust.
  types-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pwamote-core
      - run: git diff --exit-code -- client/src/generated
