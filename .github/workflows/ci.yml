name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-dist
          path: desktop-ui/dist

  rust:
    # Le serveur cible Windows : on teste et on compile là où il tournera.
    runs-on: windows-latest
    needs: [client, desktop-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist
      - uses: actions/download-artifact@v4
        with:
          name: desktop-ui-dist
          path: desktop-ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p pwamote-server
      - uses: actions/upload-artifact@v4
        with:
          name: pwamote-server-windows
          path: target/release/pwamote-server.exe

  # Installeur de l'application de bureau (NSIS, installation par utilisateur, sans droits administrateur).
  installer:
    runs-on: windows-latest
    needs: [client, desktop-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist
      - uses: actions/download-artifact@v4
        with:
          name: desktop-ui-dist
          path: desktop-ui/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - run: npm ci
        working-directory: desktop-ui
      # Le CLI Tauri est installé dans desktop-ui ; on le lance depuis le dossier du crate.
      - run: npm exec --prefix ../../desktop-ui -- tauri build --ci
        working-directory: crates/pwamote-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: pwamote-installer-windows
          path: target/release/bundle/nsis/*.exe

  # Les types TypeScript générés par ts-rs doivent toujours refléter le protocole Rust.
  types-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pwamote-core
      - run: git diff --exit-code -- client/src/generated
