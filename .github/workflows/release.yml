name: Release

# Pousser un tag de version publie une release :
#   git tag v1.2.3 && git push origin v1.2.3
# Ne pas créer la release à la main sur GitHub : les releases sont immuables, une release
# publiée sans fichiers ne peut plus être complétée et son tag ne peut plus resservir.
# La CI complète tourne avec la version injectée, puis la release GitHub est créée avec
# l'installeur, le serveur seul, leurs empreintes SHA-256 et le changelog depuis le tag précédent.
# Sans accès à git (depuis un téléphone) : onglet Actions › Release › Run workflow, en saisissant
# le tag. Le workflow crée alors le tag sur la tête de la branche choisie, puis publie pareil.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à créer sur cette branche puis à publier (ex. v1.3.6)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Créer le tag (lancement manuel)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag invalide : « $TAG » (attendu : v1.2.3 ou v1.2.3-beta.1)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Le tag $TAG existe déjà : choisir une version plus récente."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          echo "Tag $TAG créé sur $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(node scripts/set-version.mjs --print "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # v1.2.3-beta.1 → pré-release
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
    # Secrets de signature Authenticode (docs/signature-windows.md), ignorés s'ils sont absents.
    secrets: inherit

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: pwamote-installer-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pwamote-portable-windows
          path: dist
      - name: Nommer les binaires
        working-directory: dist
        run: |
          # L'application sans installation : s'ouvre sans console, `--console` pour le serveur seul.
          mv pwamote-desktop.exe "PwaMote_${VERSION}_x64_portable.exe"
          ls -l
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Changelog depuis le tag précédent
        run: |
          # Le titre de la release porte déjà la version : on retire le titre de section.
          npx --yes git-cliff@2.14.2 --current --strip all | sed '0,/^## /{/^## /d}' > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publier la release
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease) || flags+=(--latest)
          # Les releases du dépôt sont immuables : une fois publiée, une release ne peut plus
          # recevoir de fichiers. On remplit donc un brouillon, puis on le publie en dernier.
          # (Liste complète : l'API par tag ne voit pas les brouillons.)
          state="$(gh api "repos/$GH_REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | \"\\(.draft) \\(.immutable)\"" | head -n1)"
          if [[ -n "$state" ]]; then
            read -r draft immutable <<< "$state"
            if [[ "$draft" != "true" && "$immutable" == "true" ]]; then
              echo "::error::La release $TAG est déjà publiée et immuable (créée à la main sur GitHub ?) : impossible d'y ajouter les fichiers. Supprimer cette release et publier un nouveau tag (le nom $TAG ne peut plus être réutilisé). Pour publier, pousser seulement le tag : git tag vX.Y.Z && git push origin vX.Y.Z."
              exit 1
            fi
            # Relance du workflow ou brouillon existant : on remplace notes et fichiers.
            gh release edit "$TAG" --title "PwaMote $VERSION" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "PwaMote $VERSION" --notes-file notes.md
          fi
          gh release edit "$TAG" --draft=false "${flags[@]}"
