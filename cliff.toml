# Changelog généré depuis les messages de commit (Conventional Commits, voir CONTRIBUTING.md).
# Utilisé par la CI (aperçu « Non publié » sur main) et par le workflow de release (notes du tag).
# En local : `npx git-cliff --unreleased` ou `npx git-cliff --latest`.

[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Non publié
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}** : {% endif %}\
{% if commit.breaking %}**[incompatible]** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first | replace(from="<", to="&lt;") }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/wardensfx/pwamote/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
{% if previous and previous.version and version %}
**Toutes les modifications** : [{{ previous.version }}...{{ version }}](https://github.com/wardensfx/pwamote/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Les anciens commits sans type restent listés, sous « Divers ».
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 0 -->⚠️ Changements incompatibles" },
  { body = "BREAKING CHANGE", group = "<!-- 0 -->⚠️ Changements incompatibles" },
  { message = "^feat", group = "<!-- 1 -->✨ Nouveautés" },
  { message = "^fix", group = "<!-- 2 -->🐛 Corrections" },
  { message = "^perf", group = "<!-- 3 -->⚡ Performances" },
  { message = "^docs", group = "<!-- 4 -->📝 Documentation" },
  { message = "^(refactor|style|test|build|ci|chore)", group = "<!-- 5 -->🔧 Maintenance" },
  { message = ".*", group = "<!-- 6 -->Divers" },
]
