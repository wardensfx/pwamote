# Service DNS de PwaMote. Mise en service : voir README.md de ce dossier.
name = "pwamote-relay"
main = "src/index.ts"
compatibility_date = "2025-10-01"
# Garde le secret CF_API_TOKEN ajouté dans le tableau de bord à chaque déploiement.
keep_vars = true
routes = [{ pattern = "dns.pwamote.app", custom_domain = true }]

[vars]
ZONE_NAME = "pwamote.app"
# Noms des PC : <id>.d.pwamote.app (seul d.pwamote.app ira sur la Public Suffix List).
DEVICE_SUFFIX = "d.pwamote.app"
# ID de la zone (public, pas un secret) : évite d'avoir à chercher la zone avec le jeton.
ZONE_ID = "560e8b3d21017f4ec6887dbaa2caf9e5"

# Espace de stockage des inscriptions : créé automatiquement au premier déploiement.
[[kv_namespaces]]
binding = "DEVICES"

# Ménage hebdomadaire des PC disparus depuis plus de 180 jours.
[triggers]
crons = ["17 3 * * 1"]
